<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rola D20</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2B183F">

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #2B1B3F;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
        }

        #resultado {
            font-size: 80px;
            margin: 30px;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #C03928;
            color: white;
            cursor: pointer;
        }

        #msg {
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Dado de 6 lados</h1></h1>

    <p id="resultado">?</p>

    <button onclick="rolar()">Rolar o dado</button>

    <p id="msg"></p>

    <script>

        function rolar() {

            const n = Math.floor(Math.random() * 6) + 1;

            document.getElementById("resultado").textContent = n;

            let msg = "Rolagem normal.";

            if (n === 6) msg = "CRÍTICO! Sucesso épico!";

            if (n === 1) msg = "Falha crítica... o dragão saiu.";

            document.getElementById("msg").textContent = msg;

        }

        // Liga o service worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }

    </script>

</body>

</html>
